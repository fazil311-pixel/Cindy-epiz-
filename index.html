<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Epiz - Video & Chat</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        :root { --primary: #3d5afe; --bg: #0f1014; --card: #1e1e26; --text: #ffffff; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: var(--bg); color: var(--text); margin: 0; display: flex; justify-content: center; align-items: center; height: 100vh; }
        
        /* Lobby Styles */
        #lobby { text-align: center; background: var(--card); padding: 40px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); width: 350px; }
        .preview-box { width: 100%; height: 200px; background: #000; border-radius: 12px; margin: 20px 0; overflow: hidden; border: 2px solid var(--primary); }
        #previewVideo { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
        input { width: 90%; padding: 12px; border-radius: 8px; border: 1px solid #444; background: #2a2a35; color: white; margin-bottom: 20px; }
        
        /* Call Room Styles */
        #callRoom { display: none; width: 95%; max-width: 1200px; height: 90vh; flex-direction: column; }
        .main-layout { display: flex; flex: 1; gap: 20px; min-height: 0; }
        .video-section { flex: 3; display: flex; flex-direction: column; gap: 10px; }
        .video-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; flex: 1; }
        video { width: 100%; height: 100%; background: #222; border-radius: 12px; object-fit: cover; }
        .local { transform: scaleX(-1); border: 2px solid var(--primary); }
        
        /* Chat Styles */
        .chat-section { flex: 1; background: var(--card); border-radius: 12px; display: flex; flex-direction: column; overflow: hidden; }
        #chatBox { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 8px; }
        .msg { padding: 8px 12px; border-radius: 8px; background: #333; font-size: 0.9rem; max-width: 80%; }
        .msg.me { align-self: flex-end; background: var(--primary); }
        .chat-input { display: flex; padding: 10px; gap: 5px; background: #252530; }
        .chat-input input { margin-bottom: 0; padding: 8px; }

        /* Controls */
        .controls { display: flex; justify-content: center; gap: 15px; padding: 20px 0; }
        button { padding: 12px 20px; border-radius: 8px; border: none; cursor: pointer; font-weight: bold; background: var(--primary); color: white; }
        .btn-off { background: #ff5252; }
    </style>
</head>
<body>

    <div id="lobby">
        <h1 style="margin:0; color: var(--primary);">Epiz</h1>
        <div class="preview-box"><video id="previewVideo" autoplay muted></video></div>
        <input type="text" id="userName" placeholder="Enter name (e.g. Cindy)">
        <button id="joinBtn" style="width: 100%;">Enter Room</button>
    </div>

    <div id="callRoom">
        <div class="main-layout">
            <div class="video-section">
                <div class="video-grid">
                    <video id="localVideo" class="local" autoplay muted></video>
                    <video id="remoteVideo" autoplay></video>
                </div>
                <div class="controls">
                    <button id="muteBtn">Mute Mic</button>
                    <button id="videoBtn">Stop Video</button>
                    <button id="copyBtn" style="background: #444;">Copy Invite Link</button>
                </div>
            </div>
            <div class="chat-section">
                <div id="chatBox"></div>
                <div class="chat-input">
                    <input type="text" id="msgInput" placeholder="Message...">
                    <button id="sendBtn">Send</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        let localStream, peer, dataConn;
        let micOn = true, videoOn = true;

        const urlParams = new URLSearchParams(window.location.search);
        const roomIDFromUrl = urlParams.get('room');

        // Start Preview
        navigator.mediaDevices.getUserMedia({ video: true, audio: true }).then(stream => {
            localStream = stream;
            document.getElementById('previewVideo').srcObject = stream;
        });

        // Auto-fill and join if link shared
        if(roomIDFromUrl) {
            document.getElementById('userName').value = roomIDFromUrl.replace('-epiz', '');
        }

        document.getElementById('joinBtn').onclick = () => {
            const name = document.getElementById('userName').value.trim() || "User";
            const finalID = name.toLowerCase().replace(/\s+/g, '-') + "-epiz";
            
            window.history.replaceState({}, '', `?room=${finalID}`);
            document.getElementById('lobby').style.display = "none";
            document.getElementById('callRoom').style.display = "flex";
            document.getElementById('localVideo').srcObject = localStream;

            initPeer(finalID);
        };

        function initPeer(id) {
            peer = new Peer(id);

            peer.on('open', () => {
                if (roomIDFromUrl && roomIDFromUrl !== id) {
                    // We are the guest, call the person in the URL
                    makeCall(roomIDFromUrl);
                    connectChat(roomIDFromUrl);
                }
            });

            // Handle Incoming Video Call
            peer.on('call', (call) => {
                call.answer(localStream);
                call.on('stream', remoteStream => {
                    document.getElementById('remoteVideo').srcObject = remoteStream;
                });
            });

            // Handle Incoming Chat Connection
            peer.on('connection', (conn) => {
                dataConn = conn;
                setupChatListeners();
            });
        }

        function makeCall(targetId) {
            const call = peer.call(targetId, localStream);
            call.on('stream', remoteStream => {
                document.getElementById('remoteVideo').srcObject = remoteStream;
            });
        }

        function connectChat(targetId) {
            dataConn = peer.connect(targetId);
            setupChatListeners();
        }

        function setupChatListeners() {
            dataConn.on('data', data => appendMsg("Friend", data));
        }

        // UI Interactions
        document.getElementById('sendBtn').onclick = () => {
            const msg = document.getElementById('msgInput').value;
            if(dataConn && msg) {
                dataConn.send(msg);
                appendMsg("Me", msg);
                document.getElementById('msgInput').value = "";
            }
        };

        function appendMsg(sender, text) {
            const div = document.createElement('div');
            div.className = `msg ${sender === 'Me' ? 'me' : ''}`;
            div.innerHTML = `<b>${sender}:</b> ${text}`;
            document.getElementById('chatBox').appendChild(div);
            document.getElementById('chatBox').scrollTop = document.getElementById('chatBox').scrollHeight;
        }

        document.getElementById('muteBtn').onclick = (e) => {
            micOn = !micOn;
            localStream.getAudioTracks()[0].enabled = micOn;
            e.target.innerText = micOn ? "Mute Mic" : "Unmute Mic";
            e.target.classList.toggle('btn-off');
        };

        document.getElementById('videoBtn').onclick = (e) => {
            videoOn = !videoOn;
            localStream.getVideoTracks()[0].enabled = videoOn;
            e.target.innerText = videoOn ? "Stop Video" : "Start Video";
            e.target.classList.toggle('btn-off');
        };

        document.getElementById('copyBtn').onclick = (e) => {
            navigator.clipboard.writeText(window.location.href);
            e.target.innerText = "Link Copied!";
            setTimeout(() => e.target.innerText = "Copy Invite Link", 2000);
        };
    </script>
</body>
</html>
